spring.application.name=NEXTKEY
spring.datasource.url=${NEXTKEY_DB_URL}
spring.datasource.username=${NEXTKEY_DB_USER}
spring.datasource.password=${NEXTKEY_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
