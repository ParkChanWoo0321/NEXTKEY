name: nextkey
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${NEXTKEY_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: nextkey
      MYSQL_USER: ${NEXTKEY_DB_USER:?Set NEXTKEY_DB_USER}
      MYSQL_PASSWORD: ${NEXTKEY_DB_PASSWORD:?Set NEXTKEY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NEXTKEY_MYSQL_ROOT_PASSWORD:?Set NEXTKEY_MYSQL_ROOT_PASSWORD}
    volumes:
      - nextkey-db:/var/lib/mysql
volumes:
  nextkey-db:
